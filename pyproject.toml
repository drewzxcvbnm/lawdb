[project]
name = "lawdb"
version = "0.1.0"
description = "Local keyword search for Latvian court decisions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
